# What Coulisses.app is built from (ADR 0040, 0041): pinned versions, verified digests.
# Downloaded once, on request (`scripts/construire.py --telecharger`), into
# ~/Library/Caches/Coulisses/construction; never at run time (P1).

[app]
name = "Coulisses"
# The published app's identifier: macOS ties the permissions to it (with the signature).
identifier = "io.github.tibserre.coulisses"
minimum_macos = "14.4"

[signature]
# The self-signed certificate of ADR 0040, in this Mac's login keychain, never in git
# (how to make it: docs/technique/certificat.md). macOS ties the friends' permissions to
# it: every version is signed with the same one.
identity = "Coulisses"

[sparkle]
# The updates (ADR 0040), in the launcher of the published app only.
version = "2.10.0"
url = "https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz"
# As published by GitHub for this release: checked before anything else.
sha256 = "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c"
# Where the app reads which version is the latest: the appcast of the latest release.
feed_url = "https://github.com/Tibserre/coulisses/releases/latest/download/appcast.xml"
# The public half of the EdDSA key that signs each update (the private half stays in this
# Mac's keychain: docs/technique/certificat.md). Empty: no updates in the app.
public_key = "FrX3p/sJ+KIF1J60fZxA1cwNBqbiw0hy8GuCXK5XsbY="

[uv]
# Copied into the .app (the engine installs its environments with it), and the one that
# picks the python-build-standalone release: the build refuses another version.
version = "0.12.18"

[python]
# python-build-standalone, fetched and verified (digest) by `uv python install`.
version = "3.12.14"

[ffmpeg]
version = "9.0.2"
url = "https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz"
# As published by Homebrew's formula for the same archive: checked before anything else.
sha256 = "8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e"
# Audio only, LGPL, static, no network (ADR 0041). What the app, the engine and mlx-audio
# ask of it: read a recording (file or pipe), write f32le, s16le or WAV, resampled.
protocols = ["file", "pipe"]
demuxers = ["wav", "w64", "aiff", "caf", "mov", "mp3", "flac", "ogg", "aac", "matroska"]
decoders = [
  "pcm_s16le", "pcm_s16be", "pcm_s24le", "pcm_s24be", "pcm_s32le", "pcm_s32be",
  "pcm_f32le", "pcm_f32be", "pcm_f64le", "pcm_f64be", "pcm_u8", "pcm_alaw", "pcm_mulaw",
  "aac", "alac", "mp3", "mp3float", "flac", "opus", "vorbis",
]
parsers = ["aac", "mpegaudio", "flac", "opus", "vorbis"]
encoders = ["pcm_s16le", "pcm_f32le"]
# Muxers by ffmpeg's names: `-f s16le` and `-f f32le` are pcm_s16le and pcm_f32le.
muxers = ["wav", "pcm_s16le", "pcm_f32le"]
filters = ["aresample", "aformat", "anull"]
