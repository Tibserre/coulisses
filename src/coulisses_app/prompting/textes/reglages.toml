# Réglages de génération livrés avec l'application. Changer de modèle par défaut se fait
# ici, ou dans l'interface (le choix y est retenu) : jamais dans le code (P6).

# Modèle Ollama proposé tant que l'utilisateur n'en a pas choisi un autre (2026-10-06).
modele_par_defaut = "qwen3.6:35b-mlx"

# Fenêtre de contexte demandée à Ollama à chaque appel (toujours explicite : Ollama
# tronque en silence sans elle). Elle reste sous le maximum du modèle.
num_ctx = 65536

# Place gardée pour la réponse, en tokens : le prompt doit tenir dans num_ctx moins cela.
reserve_reponse = 6144
reserve_titre = 128
# Un titre plus long est redemandé une fois, plus court ; il n'est jamais coupé.
mots_max_titre = 8
# Les chapitres : une liste JSON (début, type, titre), une ligne par chapitre.
reserve_chapitres = 4096
# Les chapitres se lisent par parties d'au plus cette durée, en minutes (ADR 0044) : un
# petit modèle perd le fil d'une séance entière. Les parties ont toutes la même durée.
partie_chapitres_min = 15
# Chaque partie, sauf la première, est précédée d'autant de minutes de la précédente,
# rappelées sans être découpées, pour juger si elle la continue (0 : aucun rappel).
rappel_chapitres_min = 3
# Combien dure un chapitre, au plus court et au plus long, en minutes : le modèle reçoit
# l'ordre de grandeur qui en découle pour chaque partie (ADR 0044).
minutes_par_chapitre = [6, 10]
# Une fois découpés, le type de chaque chapitre est vérifié : le chapitre est relu seul pour
# dire s'il est joué ou non (ADR 0045). Un appel court de plus par chapitre.
verifier_types_chapitres = true

# Caractères par token, volontairement bas pour surestimer la taille du prompt : Ollama
# ne permet pas de compter les tokens avant l'envoi (ADR 0022). Mesuré le 2026-10-06 avec
# qwen3.6 sur une vraie séance : 3,0 en moyenne, 2,1 sur les répliques courtes.
caracteres_par_token = 1.8

temperature = 0.3
graine = 42

# Le modèle de langage conseillé à un Mac selon sa mémoire (onglet Rédaction ; lot 11g du
# plan). Chaque tranche vaut à partir de sa mémoire, en Go. Un modèle n'y est nommé qu'après
# une comparaison sur de vraies séances (skill /action-resume) : vide d'ici là.
memoire_min_redaction_go = 16

[[conseil]]
memoire_min_go = 48
modele = ""

[[conseil]]
memoire_min_go = 24
modele = ""

[[conseil]]
memoire_min_go = 16
modele = ""
